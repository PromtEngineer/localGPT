name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff + black + mypy)
    runs-on: ubuntu-latest
    # Advisory: this codebase predates black/ruff/mypy adoption, so lint runs
    # and reports but does not block. Correctness is gated by unit-tests and
    # the deterministic retrieval gate below. Tighten to a hard gate after a
    # one-time format pass + typing work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: pip install ruff black mypy

      - name: ruff check
        run: ruff check rag_system/ backend/ --ignore E501,ANN

      - name: black check
        run: black --check rag_system/ backend/

      - name: mypy
        run: mypy rag_system/ backend/ --ignore-missing-imports --check-untyped-defs --no-error-summary

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest \
            test_hybrid_retrieval.py \
            test_incremental_indexing.py \
            test_logging_utils.py \
            test_backend_api_contract.py \
            test_persistent_cache.py \
            test_regression_fixes.py \
            -v --tb=short --cov=backend --cov=rag_system --cov-report=term-missing --cov-report=xml

      - name: Run deterministic retrieval gate
        run: python rag_eval.py gate

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Run UI lint
        run: npm run lint:ui

      - name: Run full lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
