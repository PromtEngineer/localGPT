name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff + black + mypy)
    runs-on: ubuntu-latest
    # Enforced: rag_system/ and backend/ are ruff-clean, black-formatted, and
    # mypy-clean (--check-untyped-defs). Linter versions are pinned so a new
    # release can't break the gate on unrelated changes. ruff config (select +
    # curated ignores) lives in pyproject.toml [tool.ruff.lint].
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linters
        run: pip install ruff==0.15.17 black==26.5.1 mypy==2.1.0

      - name: ruff check
        run: ruff check rag_system/ backend/

      - name: black check
        run: black --check rag_system/ backend/

      - name: mypy
        run: mypy rag_system/ backend/ --ignore-missing-imports --check-untyped-defs --no-error-summary

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest \
            test_hybrid_retrieval.py \
            test_incremental_indexing.py \
            test_logging_utils.py \
            test_backend_api_contract.py \
            test_persistent_cache.py \
            test_regression_fixes.py \
            -v --tb=short --cov=backend --cov=rag_system --cov-report=term-missing --cov-report=xml

      - name: Run deterministic retrieval gate
        run: python rag_eval.py gate

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Run UI lint
        run: npm run lint:ui

      - name: Run full lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
