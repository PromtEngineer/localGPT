services:
  # Unified backend + RAG runtime (connects to host Ollama)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    ports:
      # Publish on loopback only — the backend API is unauthenticated
      - "127.0.0.1:8000:8000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - BIND_HOST=0.0.0.0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      # Mount the whole backend dir, not just chat_data.db: SQLite WAL mode
      # creates sidecar -wal/-shm files that a single-file bind mount misses
      - ./backend:/app/backend
      - ./lancedb:/app/lancedb
      - ./index_store:/app/index_store
      - ./shared_uploads:/app/shared_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

  # Frontend Next.js application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the bundle at BUILD time;
        # setting them as runtime environment has no effect
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: rag-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node:18-alpine ships busybox wget, not curl
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge 
